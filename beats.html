<!DOCTYPE html>
<html>
<head>
    <title>Catálogo de Beats - RVC Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        /* Contenedor que mantiene la proporción */
        .player-wrapper {
            position: relative;
            width: 100%;
            /* Esta es la proporción: 16 de ancho por 9 de alto (formato cine) */
            /* Puedes cambiar 9/16 por otros valores si lo prefieres */
            padding-bottom: 56.25%; /* 9 dividido entre 16, multiplicado por 100 */
            height: 0;
            overflow: hidden;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <iframe src="https://player.beatstars.com/?storeId=153060"></iframe>
    </div>
</body>
</html>
