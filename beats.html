<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Beats - RVC Studio</title>

    <!-- FONDO GALAXIA (mismo que usas en las otras páginas) -->
    <link rel="stylesheet" href="fondo-galaxia.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Contenedor que ocupa toda la pantalla visible */
        .player-fullscreen {
            width: 100%;
            height: 100vh; /* 100% de la altura de la pantalla */
            min-height: 600px; /* Evita que se aplaste en pantallas muy bajas */
            position: relative;
            z-index: 1;
        }

        .player-fullscreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="player-fullscreen">
        <iframe src="https://player.beatstars.com/?storeId=153060"></iframe>
    </div>

</body>
</html>
